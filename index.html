<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catamarca Directo - Negocios y Profesionales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" class="container">
        <header class="header">
            <h1>📍 Catamarca Directo</h1>
            <p>Encuentra negocios y profesionales locales</p>
            <a href="admin.html" class="admin-link">Panel Admin</a>
        </header>

        <main class="main-content">
            <div class="search-section">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Busca un oficio, negocio, profesional..."
                >
            </div>

            <div class="filters">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="all">Todos</button>
                    <button class="filter-btn" data-filter="business">Negocios</button>
                    <button class="filter-btn" data-filter="professional">Profesionales</button>
                </div>

                <div class="filter-categories" id="categoriesContainer">
                    <!-- Se llena dinámicamente -->
                </div>
            </div>

            <div id="resultsContainer" class="results-container">
                <p class="loading">Cargando...</p>
            </div>
        </main>
    </div>

    <!-- Modal de detalle -->
    <div id="detailModal" class="modal hidden">
        <div class="modal-content" id="modalContent">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
